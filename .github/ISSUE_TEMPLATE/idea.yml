name: Idea
description: Suggest a feature or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      placeholder: Show how many cars I counted per hour.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: The situation where you missed it.
