name: PR title

# PRs are squash-merged and the PR title becomes the commit on main, which is what
# semantic-release reads to pick the next version. So the title must be a
# Conventional Commit: feat: / fix: / perf: ... (feat!: or BREAKING CHANGE for majors).
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            style
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
