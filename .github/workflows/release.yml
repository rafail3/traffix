name: Release

# Every push to main: semantic-release reads the commits since the last tag and, if
# any of them is a feat/fix/perf (or breaking), tags vX.Y.Z and creates a GitHub
# Release. Each release then gets a signed APK attached; the site's download button
# always points at the latest one.
#
# Web-only changes skip the Android build: when every release-worthy commit since the
# last release is scoped `web` (e.g. `feat(web): side card on laptop`), the new release
# gets the previous release's APK copied over instead of a rebuild. Anything else,
# scope missing included, builds a fresh APK, so forgetting the scope never ships a
# stale app.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version + GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semrel.outputs.new_release_published }}
      version: ${{ steps.semrel.outputs.new_release_version }}
      major: ${{ steps.semrel.outputs.new_release_major_version }}
      minor: ${{ steps.semrel.outputs.new_release_minor_version }}
      patch: ${{ steps.semrel.outputs.new_release_patch_version }}
      last_tag: ${{ steps.semrel.outputs.last_release_git_tag }}
      apk: ${{ steps.apk.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - id: semrel
        uses: cycjimmy/semantic-release-action@v8
        with:
          semantic_version: 26.0.1
          extra_plugins: |
            conventional-changelog-conventionalcommits@10.4.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build or reuse the APK?
        id: apk
        if: steps.semrel.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAST_HEAD: ${{ steps.semrel.outputs.last_release_git_head }}
          LAST_TAG: ${{ steps.semrel.outputs.last_release_git_tag }}
        run: |
          mode=build
          assets=$([ -n "$LAST_TAG" ] && gh release view "$LAST_TAG" --json assets -q '.assets[].name' || true)
          if grep -qx traffix.apk <<< "$assets" && grep -qx traffix.json <<< "$assets"; then
            # Release-worthy commits (feat/fix/perf/refactor/revert or breaking) not scoped `web`.
            app=$(git log --format=%s "$LAST_HEAD..HEAD" |
              grep -E '^(feat|fix|perf|refactor|revert)(\([^)]*\))?!?:|^[a-z]+(\([^)]*\))?!:' |
              grep -vE '^[a-z]+\(web\)!?:' || true)
            [ -z "$app" ] && mode=reuse
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "APK: $mode" >> "$GITHUB_STEP_SUMMARY"

  apk-reuse:
    name: Same APK (web-only release)
    needs: release
    if: needs.release.outputs.apk == 'reuse'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ needs.release.outputs.version }}
      LAST_TAG: ${{ needs.release.outputs.last_tag }}
    steps:
      - name: Copy the APK from the previous release
        run: |
          gh release download "$LAST_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'traffix.*'
          sha256sum -c traffix.apk.sha256
          # traffix.json keeps the APK's own version, so installed apps see no update.
          gh release upload "$TAG" traffix.apk traffix.apk.sha256 traffix.json --repo "$GITHUB_REPOSITORY" --clobber

  apk:
    name: Signed APK
    needs: release
    if: needs.release.outputs.apk == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TAG: v${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Web build (static export)
        run: |
          npm ci
          STATIC_EXPORT=1 npm run build
          npx cap sync android

      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. Run scripts/setup-android-signing.ps1 once."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Gradle assembleRelease
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAJOR: ${{ needs.release.outputs.major }}
          MINOR: ${{ needs.release.outputs.minor }}
          PATCH: ${{ needs.release.outputs.patch }}
        # 1.2.3 -> 1002003: always grows with the version, fits Android's int limit.
        run: |
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          ./gradlew assembleRelease --no-daemon -PversionName="$VERSION" -PversionCode="$VERSION_CODE"

      - name: Verify signature
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs "$APK"
          cp "$APK" traffix.apk
          sha256sum traffix.apk > traffix.apk.sha256

      # What the app reads to decide whether to offer an update (see app/AppUpdate.tsx).
      - name: Update manifest
        run: |
          jq -n --arg name "$VERSION" --argjson code "$VERSION_CODE"             --arg sha "$(cut -d' ' -f1 traffix.apk.sha256)" --argjson size "$(stat -c%s traffix.apk)"             --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/traffix.apk"             '{versionName: $name, versionCode: $code, sha256: $sha, size: $size, url: $url}' > traffix.json
          cat traffix.json

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" traffix.apk traffix.apk.sha256 traffix.json --clobber

      # The website serves its own copy of the APK (scripts/fetch-apk.mjs runs at build time),
      # so rebuild it now that a new APK exists.
      - name: Refresh the website
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK is not set; the site keeps the previous APK until its next deploy."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
